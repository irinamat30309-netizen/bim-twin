name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Production dependency audit
        run: npm run audit:production
      - name: Syntax check
        run: npm run check
      - name: Check all JavaScript files
        run: node scripts/check-syntax.mjs
      - name: Unit tests
        # При падении имена упавших тестов выводятся аннотациями (лог задачи виден только авторизованным пользователям)
        run: |
          node --test > unit.log 2>&1 || { grep -E "✖|not ok" unit.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done; tail -80 unit.log; exit 1; }
          tail -8 unit.log
      - name: Project storage regression
        run: npm run test:store

  windows-test:
    # Native Windows behavior cannot be inferred from Wine/static checks:
    # exercise workers, temporary paths, atomic writes and filesystem tests
    # on the actual GitHub-hosted Windows runner for every push/PR.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Production dependency audit
        run: npm run audit:production
      - name: Syntax check
        run: npm run check
      - name: Check all JavaScript files
        run: node scripts/check-syntax.mjs
      - name: Point-cloud and project regression tests
        run: node --test
      - name: Project storage regression
        run: npm run test:store
