name: Windows package QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - agent/stage3-4-ci-sync
      - agent/windows-package-qa
  pull_request:
    branches:
      - main
      - master
      - agent/stage3-4-ci-sync

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax, Python, and storage checks
        run: |
          npm run check
          node scripts/check-syntax.mjs
          node --check pointcloud-ply-io.js
          python scripts/check-python-syntax.py
          npm run test:store

      - name: Full regression suite
        run: npm test

      - name: Build Windows NSIS installer and ASAR
        run: npm run dist:win

      - name: Verify installer and packaged ASAR contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'dist' -Filter '*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -le 0) {
            Write-Host '::error::Windows NSIS installer was not produced in dist/.'
            exit 1
          }

          $asar = Get-ChildItem -Path 'dist' -Filter 'app.asar' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $asar -or $asar.Length -le 0) {
            Write-Host '::error::Electron app.asar was not produced.'
            exit 1
          }

          $asarCli = Join-Path $PWD 'node_modules/@electron/asar/bin/asar.js'
          if (-not (Test-Path $asarCli)) {
            Write-Host "::error::ASAR CLI script not found at $asarCli"
            exit 1
          }
          $entries = @(& node $asarCli list $asar.FullName)
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::ASAR CLI exited with code $LASTEXITCODE"
            exit 1
          }
          $entrySet = @($entries | ForEach-Object { ([string]$_).Replace([char]92, [char]47).Trim().Trim([char]47) })
          $requiredEntries = @(
            'main.js',
            'preload.js',
            'renderer/app.js',
            'renderer/pointcloud-edit.js',
            'pointcloud-ply-io.js',
            'tools/pointcloud_geometry.py'
          )
          $missing = @($requiredEntries | Where-Object { $entrySet -notcontains $_ })
          if ($missing.Count -gt 0) {
            Write-Host "::error::ASAR is missing required application files: $($missing -join ', ')"
            Write-Host "ASAR listing sample: $($entrySet | Select-Object -First 20 | Out-String)"
            exit 1
          }
          Write-Host "Installer: $($installer.Name) ($($installer.Length) bytes)"
          Write-Host "ASAR: $($asar.FullName) ($($asar.Length) bytes)"
          Write-Host 'Required Electron, PLY, and geometry files are present in app.asar.'

      - name: Upload Windows QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-qa
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/**/*.yml
            dist/**/app.asar
          if-no-files-found: warn
          retention-days: 7
