name: Windows package QA

on:
  workflow_dispatch:
  # Run once on the review branch so the first package build is verified.
  push:
    branches:
      - agent/windows-package-qa

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax and project checks
        run: |
          npm run check
          node scripts/check-syntax.mjs
          npm run test:store

      - name: Full regression suite
        run: npm test

      - name: Build Windows NSIS installer and ASAR
        run: npm run dist:win

      - name: Verify installer and packaged ASAR contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'dist' -Filter '*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -le 0) {
            throw 'Windows NSIS installer was not produced in dist/.'
          }

          $asar = Get-ChildItem -Path 'dist' -Filter 'app.asar' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $asar -or $asar.Length -le 0) {
            throw 'Electron app.asar was not produced.'
          }

          $asarCli = Join-Path $PWD 'node_modules/.bin/asar.cmd'
          if (-not (Test-Path $asarCli)) {
            throw 'ASAR CLI is missing after npm ci; cannot inspect archive contents.'
          }
          $entries = @(& $asarCli list $asar.FullName)
          if ($LASTEXITCODE -ne 0) {
            throw 'ASAR archive could not be listed.'
          }
          $entrySet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($entry in $entries) {
            $normalized = ([string]$entry).Trim().Trim('/').Replace([string][char]92, '/').TrimEnd('/')
            if ($normalized) { [void]$entrySet.Add($normalized) }
          }
          $requiredEntries = @('main.js', 'preload.js', 'pointcloud-ply-io.js', 'renderer/app.js', 'renderer/pointcloud-edit.js')
          foreach ($required in $requiredEntries) {
            if (-not $entrySet.Contains($required)) {
              throw "ASAR is missing required application file: $required"
            }
          }
          Write-Host "Installer: $($installer.Name) ($($installer.Length) bytes)"
          Write-Host "ASAR: $($asar.FullName) ($($asar.Length) bytes)"
          Write-Host 'Required main, preload, renderer, and point-cloud files are present in app.asar.'

      - name: Upload Windows QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-qa
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/**/*.yml
            dist/**/app.asar
          if-no-files-found: warn
          retention-days: 7